name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# As versões publicadas vêm do arquivo horarios/data/versoes/manifest.json
# (são reimportadas a cada execução, preservando todo o histórico).

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Base URL dinâmica: project pages -> /repo/, user/org pages -> /
      - name: Configurar base URL do site
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            base="/"
          else
            base="/${repo}/"
          fi
          echo "SITE_BASE_URL=$base" >> "$GITHUB_ENV"
          echo "BASE=$base" >> "$GITHUB_ENV"

      - name: Migrar banco
        run: python manage.py migrate --noinput

      - name: Importar todas as versões do histórico (manifest)
        run: python manage.py import_versoes

      - name: Popular cursos (PPCs e coordenação)
        run: python manage.py seed_cursos

      - name: Gerar site estático
        run: python manage.py render_static_site

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Publicar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy
        uses: actions/deploy-pages@v4
