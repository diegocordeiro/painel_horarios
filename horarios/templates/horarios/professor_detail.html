{% extends "horarios/base.html" %}
{% block title %}{{ professor.nome }} — {{ site_title }}{% endblock %}
{% block content %}
  <nav class="breadcrumb">
    <a href="{{ base }}professor/">Professores</a> / <span>{{ professor.nome }}</span>
  </nav>

  <section class="curso-detail-hero">
    <span class="curso-avatar large">{{ professor.nome|slice:":1" }}</span>
    <div>
      <span class="curso-badge">Professor(a)</span>
      <h1>{{ professor.nome }}</h1>
    </div>
  </section>

  {% include "horarios/_timetable.html" %}
{% endblock %}
